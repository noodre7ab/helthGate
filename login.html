<body>
    <div class="login-page">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <img src="image/1.png" alt="Logo" />
                <span >Health <strong>Gate</strong></span>
            </div>
            <div class="auth-buttons">
    <button class="login" onclick="window.location.href='login.html'">Login</button>
    <button class="register" onclick="window.location.href='signUp.html'">Register</button>
</div>
        </header>

        <!-- Login Card -->
        <form  method="post"  action="check.php" enctype="multipart/form-data"> 
        <div class="login-card">
            <div class="form-section">
                <h2>Login With Your Account</h2>

                <div class="input-group">
                    <label>Enter Your Email</label>

                <div class="input-group">
                    <label>Enter Your Password</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" />

                    <div class="password-wrapper">
                        <!-- <label>Enter Your Password</label> -->
                        <!-- <input type="password" id="password" placeholder="••••••••" /> -->
                        <!-- <span class="eye" id="toggleEye">👁️</span> -->

                    </div>
                </div>

                <a href="#" class="forgot">Forget Password ?</a>

                <button class="btn main">Login</button>

                <p class="register-text">
                    Don’t have an account yet ?
                    <a href="#">Register</a>
                </p>
            </div>
        </form>
            <!-- Image Section -->
            <div class="image-section">
                <img src="image/2.png" alt="Stethoscope" />
            </div>
        </div>
